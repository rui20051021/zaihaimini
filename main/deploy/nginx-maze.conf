map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Only versioned assets can stay fresh for a week. Mutable scripts and scene
# manifests revalidate, so a release cannot silently mix old and new code.
map $arg_v $maze_static_cache {
    default "no-cache";
    "~^[a-fA-F0-9]{8,64}$" "public, max-age=604800, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 1024m;
    client_body_timeout 600s;
    send_timeout 600s;
    keepalive_timeout 75s;

    location ^~ /static/ {
        alias /opt/maze/main/static/;
        expires off;
        add_header Cache-Control $maze_static_cache;
        gzip_static on;
        gzip on;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;
        gzip_vary on;
        sendfile on;
        tcp_nopush on;
        open_file_cache max=200 inactive=60s;
        access_log off;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }
}
