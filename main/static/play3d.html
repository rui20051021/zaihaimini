function drawEffects(){ensureEffectPools();for(const mesh of smokePool)mesh.visible=false;for(const mesh of firePool)mesh.visible=false;const smoke=[...(state?.smoke||[])].sort((a,b)=>Number(b.value||0)-Number(a.value||0)).slice(0,smokePool.length);smoke.forEach((item,index)=>{const value=Math.max(0,Math.min(1,Number(item.value)||0)),p=item.position||[0,0,0],mesh=smokePool[index];mesh.position.set(p[0],p[1]+1.1,p[2]);const tier=Math.min(smokeMaterials.length-1,Math.floor(value*smokeMaterials.length));mesh.material=smokeMaterials[tier];mesh.scale.setScalar(.65+value*2.0);mesh.scale.y*=1.2;mesh.visible=value>0.001});(state?.fire||[]).slice(0,firePool.length).forEach((item,index)=>{const p=item.position||[0,0,0],mesh=firePool[index];mesh.position.set(p[0],p[1]+.55,p[2]);mesh.visible=true})}
const markerGeometry={body:new THREE.CapsuleGeometry(.22,.95,3,6),head:new THREE.SphereGeometry(.16,8,6),ring:new THREE.RingGeometry(.18,.23,16)};

function updateAgents(){const seen=new Set();for(const a of state?.agents||[]){if(a.pid===me?.pid)continue;seen.add(a.pid);let g=otherAgents.get(a.pid);if(!g){g=makeMarker(a);otherAgents.set(a.pid,g)}if(!otherMotion.has(a.pid))g.position.set(a.position.x,a.position.y,a.position.z);g.visible=!a.escaped&&!a.failed;const visualScale=agentVisualScale(state?.scene?.floors,a.floor,1.71);if(g.userData.visualScale!==visualScale){g.userData.visualScale=visualScale;g.scale.setScalar(visualScale);g.children[2].scale.setScalar(1/visualScale)}g.userData.agent=a}for(const [pid,g] of otherAgents){if(!seen.has(pid)){scene.remove(g);disposeModel(g);otherAgents.delete(pid);otherMotion.delete(pid)}}}
function updateDoorUI(){const card=$('#doorCard'),btn=$('#doorBtn'),text=$('#doorText');const a=state?.agents?.find(x=>x.pid===me?.pid),d=a?.nearby_doors?.[0];if(!d){card.classList.add('hidden');return}card.classList.remove('hidden');card.classList.toggle('bad',!d.can_open);text.textContent=`${d.name||d.id} · ${d.state}`;btn.disabled=state?.phase!=='running'||!d.can_open||d.state==='opening'||d.state==='open';btn.textContent=state?.phase!=='running'?'等待主机开始':d.state==='open'?'已打开':d.state==='opening'?'开门中…':d.can_open?'开门':'不可通行';}

let lastEffectsAt=0,lastAgentsAt=0;function updateUI(){if(!state)return;if(ws?.readyState===WebSocket.OPEN)setStatus(!modelReady?'建筑加载中，暂不可移动':state.phase==='running'?'疏散进行中':state.phase==='paused'?'实验已暂停':state.phase==='ended'?'本场结束，等待新场次':'已连接，等待主机开始','ok');me=state.agents?.find(a=>a.pid===me?.pid)||me;const a=state.agents?.find(x=>x.pid===me?.pid);if(a){$('#floorLabel').textContent=a.floor;$('#healthLabel').textContent=Math.round(a.health*100)+'%';$('#smokeLabel').textContent=Number(a.smoke||0).toFixed(2);if(a.connector)$('#phaseLabel').textContent='正在通过楼梯';else if(a.state==='queued-stairs')$('#phaseLabel').textContent='楼梯暂满，请等待通行';else if(a.blocked_reason&&state.phase==='running')$('#phaseLabel').textContent=a.blocked_reason.startsWith('door-')?'门未打开，请等待或点击开门':a.blocked_reason==='outside-navigation'?'当前位置未校准，请联系主机':'到达墙体或标注边界，请转向';else $('#phaseLabel').textContent=state.phase==='running'?'疏散中':state.phase==='paused'?'已暂停':state.phase==='ended'?'本场已结束':'待命';}$('#playerLabel').textContent=me?.name||'—';$('#you').textContent=me?.pid||'—';$('#sceneLabel').textContent=`${state.scene?.name||'3D 场景'} · ${state.scene?.navigation_review?.status==='needs-review'?'导航待复核 · 仅演示':state.scale_status==='verified'?'正式尺度':'临时比例演示'}`;const now=performance.now();if(now-lastEffectsAt>100){lastEffectsAt=now;drawEffects()}if(now-lastAgentsAt>50){lastAgentsAt=now;updateAgents()};updateDoorUI()}
let uiDirty=false,lastPacketAt=0,networkStale=false;
function applyState(next){
  if(!next?.agents)return;
  if(!next.scene&&state?.scene&&next.scene_id===state.scene_id)next={...next,scene:state.scene};
  const changed=state&&(next.round_revision!==state.round_revision||next.scene_id!==state.scene_id);
  if(changed){releaseControls();motion.reset();camReady=false;lastEffectsAt=lastAgentsAt=0;}
  state=next;if(next.you)me=next.you;
  meActor=next.agents.find(a=>a.pid===me?.pid)||null;
  if(meActor)motion.push(meActor,performance.now(),Boolean(changed)||next.phase!=='running');
  const seen=new Set();for(const a of next.agents){if(a.pid===me?.pid)continue;seen.add(a.pid);let m=otherMotion.get(a.pid);if(!m){m=new SnapshotMotion();otherMotion.set(a.pid,m);}m.push(a,performance.now(),Boolean(changed)||next.phase!=='running');}for(const pid of otherMotion.keys())if(!seen.has(pid))otherMotion.delete(pid);

let lastInputX=null,lastInputZ=null,lastInputSentAt=-Infinity;
function sendInput(force=false){if(!ws||ws.readyState!==WebSocket.OPEN||ws.bufferedAmount>8192)return;let x=0,z=0;if(controlMode==='stick'){x=input.z*Math.sin(yaw)+input.x*Math.sin(yaw+Math.PI/2);z=input.z*Math.cos(yaw)+input.x*Math.cos(yaw+Math.PI/2)}if(isMoving('forward')){x+=Math.sin(yaw);z+=Math.cos(yaw)}if(isMoving('back')){x-=Math.sin(yaw);z-=Math.cos(yaw)}if(isMoving('left')){x+=Math.sin(yaw-Math.PI/2);z+=Math.cos(yaw-Math.PI/2)}if(isMoving('right')){x+=Math.sin(yaw+Math.PI/2);z+=Math.cos(yaw+Math.PI/2)}const len=Math.hypot(x,z);if(len>1){x/=len;z/=len}if(document.hidden||networkStale||!modelReady||state?.phase!=='running'||meActor?.escaped||meActor?.failed){x=0;z=0;}const now=performance.now();if(!force&&x===lastInputX&&z===lastInputZ&&now-lastInputSentAt<(x||z?200:1000))return;lastInputX=x;lastInputZ=z;lastInputSentAt=now;ws.send(JSON.stringify({type:'input',x,z}))}
setInterval(sendInput,50);
let playerConnection=null;
function stopConnection(){playerConnection?.stop();playerConnection=null;ws=null;}
function connect(participant){
  releaseControls();stopConnection();motion.reset();
  const pid=localStorage.getItem('maze_pid')||'p'+Math.random().toString(36).slice(2,9);
  localStorage.setItem('maze_pid',pid);localStorage.setItem('maze_consent','1');
  const name='玩家'+pid.slice(-3),proto=location.protocol==='https:'?'wss':'ws';
  playerConnection=new ReconnectingSocket({
    url:()=>`${proto}://${location.host}/ws/player-v2?pid=${encodeURIComponent(pid)}&name=${encodeURIComponent(name)}&participant=${encodeURIComponent(participant)}&consent=true&compact=true`,
    onopen:socket=>{ws=socket;networkStale=false;lastPacketAt=performance.now();motion.reset();releaseControls();setStatus('已连接，等待同步','ok');},
    onmessage:e=>{try{applyState(JSON.parse(e.data))}catch(err){console.error(err)}},
    onclose:e=>{ws=null;networkStale=true;releaseControls();motion.reset();
      const messages={4001:'另一页面已接管此参与者',4003:'参与人数已满',4004:'需要完成参与确认',4005:'需要完成参与确认',4006:'本场已结束，请等待主机开始新场'};
      setStatus(messages[e.code]||'连接断开，正在恢复…','err');},
    shouldRetry:e=>![1000,1008,4001,4003,4004,4005,4006].includes(e.code),
    onretry:attempt=>setStatus(`连接中断，正在重连（${attempt}/8）…`,'err'),
    onexhausted:()=>setStatus('网络未恢复，请检查网络后点击重新加入','err')

$('#consentCheck').onchange=e=>$('#consentBtn').disabled=!e.target.checked||!$('#participantInput').value.trim();$('#participantInput').oninput=e=>$('#consentBtn').disabled=!e.target.value.trim()||!$('#consentCheck').checked;
$('#consentCard').onsubmit=e=>{e.preventDefault();const id=$('#participantInput').value.trim();if(!id)return;localStorage.setItem('maze_participant',id);$('#consentLayer').classList.add('hidden');connect(id)};

$('#cancelExitBtn').onclick=()=>{$('#exitConfirmLayer').classList.add('hidden');$('#exitButton').focus()};
$('#confirmExitBtn').onclick=()=>{releaseControls();stopConnection();localStorage.removeItem('maze_consent');$('#exitConfirmLayer').classList.add('hidden');$('#exitCompleteLayer').classList.remove('hidden');setStatus('已退出')};$('#completeRejoinBtn').onclick=showConsent;
function applyControlMode(){const stick=controlMode==='stick';document.body.classList.toggle('body-stick',stick);for(const [id,active] of [['padMode',!stick],['stickMode',stick]]){const b=$('#'+id);b.classList.toggle('active',active);b.setAttribute('aria-checked',String(active))}if(!stick){input.x=0;input.z=0;resetStick()}}

for(const b of document.querySelectorAll('[data-move]')){const k=b.dataset.move;const down=e=>{e.preventDefault();moveKeys.add(k);b.setPointerCapture?.(e.pointerId);sendInput()};const up=e=>{e.preventDefault();moveKeys.delete(k);sendInput()};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}
const keyboardMoves=new Map([['ArrowUp','forward'],['KeyW','forward'],['ArrowDown','back'],['KeyS','back'],['ArrowLeft','left'],['KeyA','left'],['ArrowRight','right'],['KeyD','right']]);
function keyboardMove(e){return keyboardMoves.get(e.code)||keyboardMoves.get(e.key)||keyboardMoves.get('Key'+String(e.key).toUpperCase())}
function isMoving(move){if(moveKeys.has(move))return true;for(const held of keyboardHeld.values())if(held===move)return true;return false}
function isTextEntry(target){const el=target instanceof Element?target:null;return Boolean(el?.closest('input,textarea,select,[contenteditable=true]'))}
function onKeyboardDown(e){if(isTextEntry(e.target))return;const move=keyboardMove(e);if(!move)return;e.preventDefault();const key=e.code||e.key;if(!keyboardHeld.has(key)){keyboardHeld.set(key,move);sendInput()}}

function stickPoint(e){const r=$('#stickZone').getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
let lastStickSentAt=0;
function updateStick(clientX,clientY){if(!stickOrigin)return;const p=stickPoint({clientX,clientY}), dx=p.x-stickOrigin.x,dy=p.y-stickOrigin.y, radius=50, mag=Math.hypot(dx,dy);const scale=mag>radius?radius/mag:1;const sx=dx*scale,sy=dy*scale;const dead=.12*radius;const normalized=Math.hypot(sx,sy)<=dead?0:(Math.hypot(sx,sy)-dead)/(radius-dead);const dir=Math.hypot(sx,sy)?1/Math.hypot(sx,sy):0;input.x=sx*dir*normalized;input.z=-sy*dir*normalized;$('#stickKnob').style.transform=`translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px))`;const now=performance.now();if(now-lastStickSentAt>=25){lastStickSentAt=now;sendInput()}}

let look=false,lx=0,ly=0;$('#lookArea').addEventListener('pointerdown',e=>{look=true;lx=e.clientX;ly=e.clientY;$('#lookArea').setPointerCapture(e.pointerId)});$('#lookArea').addEventListener('pointermove',e=>{if(!look)return;yaw-=(e.clientX-lx)*.008;pitch=clamp(pitch-(e.clientY-ly)*.006,-.7,.55);lx=e.clientX;ly=e.clientY});$('#lookArea').addEventListener('pointerup',()=>look=false);$('#lookArea').addEventListener('pointercancel',()=>look=false);applyControlMode();
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let camReady=false,lastFrame=0,lastRender=0,lastUI=0;
let fps=0,totalRenderedFrames=0;
function releaseControls(){moveKeys.clear();keyboardHeld.clear();resetStick();look=false;sendInput(true);}
addEventListener('blur',releaseControls);
document.addEventListener('visibilitychange',()=>{releaseControls();lastFrame=0;lastRender=0;renderBudget.reset(performance.now());if(!document.hidden)playerConnection?.retryNow();});
function frame(now=performance.now()){
  requestAnimationFrame(frame);if(document.hidden){lastRender=now;return;}
  const due=now-lastRender;if(due<renderBudget.periodMs-.5)return;
  lastRender=due>renderBudget.periodMs*2?now:lastRender+renderBudget.periodMs;lastFrame=now;
  if(uiDirty&&now-lastUI>80){lastUI=now;uiDirty=false;updateUI();}
  if(meActor&&motion.sample(now,camPos)){
